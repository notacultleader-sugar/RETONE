# Codemagic builds for Saytwice (the app lives in the app/ folder).
# One-time setup in Codemagic is in README.md, "Build with Codemagic".
workflows:
  android-release:
    name: Android release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - saytwice_upload_key           # the keystore reference you upload in Codemagic
      groups:
        - google_play                   # holds GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        PACKAGE_NAME: ca.notacult.apps.saytwice
      node: 20
    scripts:
      - name: Install packages
        script: cd app && npm ci
      - name: Generate the native Android project
        script: cd app && npx expo prebuild --platform android --non-interactive
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Build the release bundle
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || true)
          if [ -z "$LATEST" ]; then NEXT=$BUILD_NUMBER; else NEXT=$((LATEST + 1)); fi
          cd app/android
          ./gradlew bundleRelease -PversionCode=$NEXT -PversionName=1.0.$NEXT
    artifacts:
      - app/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic      # the App Store Connect API key name you add in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.notacult.apps.saytwice   # also picks up the keyboard's profile (ca.notacult.apps.saytwice.keyboard)
      vars:
        APP_STORE_APPLE_ID: 0000000000  # replace with the Apple ID number from App Store Connect
      node: 20
    scripts:
      - name: Install packages
        script: cd app && npm ci
      - name: Generate the native iOS project
        script: cd app && npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: cd app/ios && pod install
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd app/ios && agvtool new-version -all $((LATEST + 1))
      - name: Build the app
        script: xcode-project build-ipa --workspace "$CM_BUILD_DIR/app/ios/Saytwice.xcworkspace" --scheme Saytwice
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
